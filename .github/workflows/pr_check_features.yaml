name: Ethrex Release

on:
  pull_request:
    branches: ["**"]

jobs:
  check-ci-features:
    strategy:
      matrix:
        platform:
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - macos-latest
        include:
          - platform: ubuntu-22.04
            os: linux
            arch: x86_64
            prover_features: sp1,risc0,gpu
          - platform: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            prover_features: sp1,gpu
          - platform: macos-latest
            os: macos
            arch: aarch64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: kenchan0130/actions-system-info@master
        id: system-info

      - name: Check outputs
        run: |
          OUTPUTS=(
            "CPU Core: ${{ steps.system-info.outputs.cpu-core }}"
            "CPU Model: ${{ steps.system-info.outputs.cpu-model }}"
            "Hostname: ${{ steps.system-info.outputs.hostname }}"
            "Kernel release: ${{ steps.system-info.outputs.kernel-release }}"
            "Kernel version: ${{ steps.system-info.outputs.kernel-version }}"
            "Name: ${{ steps.system-info.outputs.name }}"
            "Platform: ${{ steps.system-info.outputs.platform }}"
            "Release: ${{ steps.system-info.outputs.release }}"
            "Total memory bytes: ${{ steps.system-info.outputs.totalmem }}"
          )
          IS_EMPTY_OUTOUT=false
          for OUTPUT in "${OUTPUTS[@]}";do
            echo "${OUTPUT}"
            OUT=$(echo "${OUTPUT}" | cut -d ':' -f2- | xargs)
            if [[ -z "${OUT}" ]];then
              IS_EMPTY_OUTOUT=true
            fi
          done
          if "$IS_EMPTY_OUTOUT";then
            exit 1
          fi

      - name: Rustup toolchain install
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"

      - name: Check runner features
        run: |
          rustc --print cfg -C target-cpu=native
